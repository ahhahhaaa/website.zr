<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶茶回忆录 | 大一上的奶茶时光</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: url("微信图片_20260201011724_549_2.jpg") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
            font-family: 'Ma Shan Zheng', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 240, 230, 0.8);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .text-box {
            font-size: 36px;
            color: #a70f24;
            text-align: center;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .image-container {
            width: 300px;
            height: 400px;
            position: relative;
            margin-bottom: 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .milk-tea-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .milk-tea-img.active {
            opacity: 1;
        }

        .back-btn {
            padding: 15px 40px;
            background: #FFC2E2;
            color: #A74F68;
            border: none;
            border-radius: 30px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .back-btn:hover {
            background: #f9a8d4;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .text-box {
                font-size: 28px;
            }
            .image-container {
                width: 250px;
                height: 350px;
            }
            .back-btn {
                font-size: 24px;
                padding: 12px 30px;
            }
            body::before {
                backdrop-filter: blur(5px);
            }
        }
    </style>
</head>
<body>
    <div class="text-box" id="textBox">我们就这样吃吃吃🤩</div>

    <div class="image-container" id="imageContainer"></div>

    <button class="back-btn" id="backBtn" onclick="window.location.href='cards.html'">返回</button>

    <script>
        const milkTeaImages = [
            "微信图片_20260201191217_597_2.jpg",
            "微信图片_20260201191218_598_2.jpg",
            "微信图片_20260201191219_599_2.jpg",
            "微信图片_20260201191220_600_2.jpg",
            "微信图片_20260201191220_601_2.jpg",
            "微信图片_20260201191221_602_2.jpg",
            "微信图片_20260201191222_603_2.jpg",
            "微信图片_20260201191223_604_2.jpg",
            "微信图片_20260201191224_605_2.jpg",
            "微信图片_20260201191225_606_2.jpg",
            "微信图片_20260201191227_607_2.jpg",
            "微信图片_20260201191228_608_2.jpg",
            "微信图片_20260201191228_609_2.jpg",
            "微信图片_20260201191229_610_2.jpg",
            "微信图片_20260201191231_611_2.jpg",
            "微信图片_20260201191231_612_2.jpg",
            "微信图片_20260201191232_613_2.jpg",
            "微信图片_20260201191233_614_2.jpg",
            "微信图片_20260201191235_616_2.jpg",
            "微信图片_20260201191236_617_2.jpg",
            "微信图片_20260201191237_618_2.jpg",
            "微信图片_20260201191238_619_2.jpg",
            "微信图片_20260201191239_620_2.jpg",
            "微信图片_20260201191240_621_2.jpg",
            "微信图片_20260201191241_622_2.jpg",
            "微信图片_20260201191242_623_2.jpg",
            "微信图片_20260201191242_624_2.jpg",
            "微信图片_20260201191243_625_2.jpg",
            "微信图片_20260201191244_626_2.jpg",
            "微信图片_20260201191245_627_2.jpg"
        ];

        const textBox = document.getElementById('textBox');
        const imageContainer = document.getElementById('imageContainer');
        const backBtn = document.getElementById('backBtn');
        
        let currentIndex = 0;

        function initImages() {
            milkTeaImages.forEach((imgSrc, index) => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'milk-tea-img';
                img.alt = `美食${index + 1}`;
                imageContainer.appendChild(img);
            });
        }

        function showNextImage() {
            if (currentIndex >= milkTeaImages.length) {
                textBox.textContent = `喜欢喜欢`;
                backBtn.style.display = 'block';
                return;
            }
            const allImages = document.querySelectorAll('.milk-tea-img');
            if (currentIndex > 0) {
                allImages[currentIndex - 1].classList.remove('active');
            }
            allImages[currentIndex].classList.add('active');
            currentIndex++;
            setTimeout(showNextImage, 2000);
        }

        window.onload = function() {
            initImages();
            setTimeout(showNextImage, 1000);
        };
    </script>
</body>
</html>
