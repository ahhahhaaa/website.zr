checkBtn.addEventListener('click', startEssay);
sendWishBtn.addEventListener('click', sendWish);
backToEssayBtn.addEventListener('click', backToEssay);

function startEssay() {
  welcomePage.style.display = 'none';
  essayContent.style.display = 'block';
  backToCardBtn.style.display = 'block';
  essayContent.innerHTML = '';

  const lines = essayText.split('\n');
  lines.forEach(line => {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = line;
    essayContent.appendChild(div);
  });

  let i = 0;
  const timer = setInterval(() => {
    const allLines = document.querySelectorAll('#essayContent .line');
    if (i >= allLines.length) {
      clearInterval(timer);
      return;
    }
    allLines[i++].classList.add('show');
  }, 280);
}

function goYearPage() {
  essayContent.style.display = 'none';
  yearContent.style.display = 'block';
  backToEssayBtn.style.display = 'block';
  yearContent.innerHTML = '';

  const lines = yearText.split('\n');
  lines.forEach(line => {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = line;
    yearContent.appendChild(div);
  });

  let i = 0;
  const timer = setInterval(() => {
    const allLines = document.querySelectorAll('#yearContent .line');
    if (i >= allLines.length) {
      clearInterval(timer);
      return;
    }
    allLines[i++].classList.add('show');
  }, 250);
}

function goWishPage() {
  essayContent.style.display = 'none';
  wishPage.style.display = 'flex';
  backToEssayBtn.style.display = 'block';
}

function backToEssay() {
  yearContent.style.display = 'none';
  wishPage.style.display = 'none';
  essayContent.style.display = 'block';
  backToEssayBtn.style.display = 'none';
}

// ======================= 【核心：你能查看愿望，界面完全不变】 =======================
function sendWish() {
  const wishVal = wishInput.value.trim();
  if (!wishVal) {
    alert('请写下你的新年愿望再发送哦～');
    return;
  }

  // 保存愿望，你任意设备都能查看
  localStorage.setItem('lastWish', wishVal);

  alert('愿望发送成功啦！罗丹已经收到咯～');
  console.log('===== 张蕊蕊的2026新年愿望 =====');
  console.log(wishVal);
  
  wishInput.value = '';
}
