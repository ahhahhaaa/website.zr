<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026新年祝福 - 登录</title>
    <style>
        /* 引入手写风格字体 */
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f0e6;
            background-image: url("微信图片_20260201005737_548_2.jpg");
            background-blend-mode: overlay;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            font-family: 'Ma Shan Zheng', cursive;
            transition: all 0.5s ease;
            position: relative;
        }

        .cartoon-item {
            position: absolute;
            z-index: 5;
            height: auto;
            pointer-events: auto;
            cursor: pointer;
            animation: float 3s ease-in-out infinite alternate;
            transition: transform 0.2s ease;
        }
        .cartoon-item:hover {
            transform: scale(1.05);
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }
        .cartoon-1 {
            top: 60px;
            left: 60px;
            width: 120px;
            animation-delay: 0s;
        }
        .cartoon-2 {
            top: 20px;
            right: 60px;
            width: 100px;
            animation-delay: 0.5s;
        }
        .cartoon-3 {
            bottom: 50px;
            left: 70px;
            width: 150px;
            animation-delay: 1s;
        }
        .cartoon-4 {
            bottom: 40px;
            right: 70px;
            width: 110px;
            animation-delay: 1.5s;
        }
        .cartoon-5 {
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            animation-delay: 2s;
        }
        .cartoon-6 {
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            animation-delay: 2.5s;
        }

        .container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            padding: 60px 50px;
            border-radius: 24px;
            box-shadow: 
                0 15px 30px rgba(0,0,0,0.08),
                inset 0 0 20px rgba(255, 255, 255, 0.25);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 10px solid rgba(240, 230, 210, 0.75);
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 4s ease forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .title {
            font-size: 36px;
            color: #a70f24;
            line-height: 2;
            margin-bottom: 40px;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.08);
            letter-spacing: 2px;
        }

        .btn {
            padding: 20px 50px;
            font-size: 26px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            min-width: 200px;
            font-family: 'Ma Shan Zheng', cursive;
            background: linear-gradient(90deg, #c8102e 0%, #d1213b 100%);
            border: 4px solid #e8c850;
            box-shadow: 
                0 8px 0 #a70f24,
                0 10px 15px rgba(0,0,0,0.08);
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn:active {
            transform: translateY(8px);
            box-shadow: 
                0 0 0 #960d20,
                0 5px 10px rgba(0,0,0,0.08);
        }

        body.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        /* 登录表单 居中 */
        .login-form {
            width: 100%;
        }
        .login-form label {
            display: block;
            font-size: 24px;
            color: #a70f24;
            margin-bottom: 10px;
            text-align: left;
        }
        .login-form input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 3px solid #d1213b;
            border-radius: 10px;
            font-family: 'Ma Shan Zheng', cursive;
            color: #a70f24;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.9);
        }
        .login-form .login-btn {
            width: 100%;
            padding: 18px;
            font-size: 24px;
        }
        .login-error {
            color: #a70f24;
            font-size: 20px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

    </style>
</head>
<body>

    <img src="1.png" class="cartoon-item cartoon-1" alt="卡通元素1" onclick="window.location.href='page1.html'">
    <img src="2.png" class="cartoon-item cartoon-2" alt="卡通元素2">
    <img src="3.png" class="cartoon-item cartoon-3" alt="卡通元素3">
    <img src="4.png" class="cartoon-item cartoon-4" alt="卡通元素4">
    <img src="5.png" class="cartoon-item cartoon-5" alt="卡通元素5">
    <img src="微信图片_20260201003432_540_2.png" class="cartoon-item cartoon-6" alt="卡通元素6">

    <!-- 中间只显示登录框，不显示“你确定？！”和Back -->
    <div class="container">
        <div class="title">请登录</div>
        <div class="login-form">
            <label for="username">姓名</label>
            <input type="text" id="username" placeholder="请输入姓名" autocomplete="off">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" autocomplete="off">
            <button class="btn login-btn" onclick="checkLogin()">登录</button>
            <div class="login-error" id="loginError">姓名或密码错误！</div>
        </div>
    </div>

    <script>
        function checkLogin() {
            const nameVal = document.getElementById('username').value.trim();
            const pwdVal = document.getElementById('password').value.trim();
            const errorTip = document.getElementById('loginError');

            // 验证账号密码
            if (nameVal === "张蕊" && pwdVal === "287259") {
                errorTip.style.display = 'none';
                // 跳转到烟花成功页面，并传递姓名参数
                window.location.href = `firework-success.html?name=${encodeURIComponent(nameVal)}`;
            } else {
                errorTip.style.display = 'block';
            }
        }

        // 回车触发登录
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkLogin();
        });

        window.onload = function() {
            document.body.classList.remove('fade-out');
        }
    </script>
</body>
</html>
