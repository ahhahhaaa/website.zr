<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻转卡片 | 烟花庆典</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f0e6;
            background-image: url("微信图片_20260201011724_549_2.jpg");
            background-blend-mode: overlay;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Ma Shan Zheng', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1500px;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 280px));
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card-wrap {
            width: 100%;
            height: 350px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 20px;
            overflow: hidden;
        }

        .card-wrap.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            letter-spacing: 2px;
            border-radius: 16px;
        }

        .card1 .card-front { background: #FFC2E2; color: #A74F68; }
        .card2 .card-front { background: #B5EAD7; color: #4F8A6D; }
        .card3 .card-front { background: #CBCEFB; color: #5B5F97; }
        .card4 .card-front { background: #FFDDAF; color: #977947; }
        .card5 .card-front { background: #99DDFF; color: #477B97; }
        .card6 .card-front { background: #FFB3BA; color: #974751; }

        .card-back {
            background: #fff8e8;
            color: #a70f24;
            transform: rotateY(180deg);
            font-size: 28px;
            text-align: center;
            padding: 20px;
        }

        .over-btn {
            margin-top: 60px;
            padding: 15px 40px;
            background: linear-gradient(120deg, #FFC2E2, #B5EAD7, #CBCEFB);
            border: none;
            border-radius: 50px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 32px;
            color: #5B5F97;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .over-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.15);
        }

        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-container {
            background: #fff8e8;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        .modal-title {
            font-size: 30px;
            color: #a70f24;
            margin-bottom: 20px;
        }
        .modal-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #CBCEFB;
            border-radius: 10px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 24px;
            margin-bottom: 20px;
            resize: none;
            min-height: 120px;
        }
        .send-btn {
            padding: 10px 30px;
            background: #FFDDAF;
            border: none;
            border-radius: 50px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            color: #977947;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .send-btn:hover {
            background: #FFC2E2;
            color: #A74F68;
        }

        @media (max-width: 768px) {
            .card-wrap {
                height: 300px;
            }
            .card-front {
                font-size: 30px;
            }
            .card-back {
                font-size: 24px;
            }
            .over-btn {
                font-size: 28px;
                padding: 12px 30px;
            }
            .modal-title {
                font-size: 26px;
            }
            .modal-input {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="cards-container">
        <div class="card-wrap card1" data-url="card1-detail.html">
            <div class="card-front">卡片 1</div>
            <div class="card-back">点击跳转<br>美食回忆录</div>
        </div>
        <div class="card-wrap card2" data-url="card2-detail.html">
            <div class="card-front">卡片 2</div>
            <div class="card-back">点击跳转<br>十上成长记&&</div>
        </div>
        <!-- 已修正：匹配奶茶页面文件名card3-detail.html -->
        <div class="card-wrap card3" data-url="card3-detail.html">
            <div class="card-front">卡片 3</div>
            <div class="card-back">点击跳转<br>奶茶</div>
        </div>
        <div class="card-wrap card4" data-url="card4-detail.html">
            <div class="card-front">卡片 4</div>
            <div class="card-back">点击跳转<br>帅哥</div>
        </div>
        <div class="card-wrap card5" data-url="card5-detail.html">
            <div class="card-front">卡片 5</div>
            <div class="card-back">点击跳转<br>眼睛变化史</div>
        </div>
        <div class="card-wrap card6" data-url="card6-detail.html">
            <div class="card-front">卡片 6</div>
            <div class="card-back">点击跳转<br>新年快乐</div>
        </div>
    </div>

    <button class="over-btn">over</button>

    <div class="modal-mask">
        <div class="modal-container">
            <div class="modal-title">告诉我你密码的含义吧？</div>
            <textarea class="modal-input" placeholder="请输入密码的含义..."></textarea>
            <button class="send-btn">发送</button>
        </div>
    </div>

    <script>
        const cardWraps = document.querySelectorAll('.card-wrap');
        const overBtn = document.querySelector('.over-btn');
        const modalMask = document.querySelector('.modal-mask');
        const modalInput = document.querySelector('.modal-input');
        const sendBtn = document.querySelector('.send-btn');

        cardWraps.forEach(card => {
            card.addEventListener('click', function() {
                this.classList.add('flipped');
                setTimeout(() => {
                    const targetUrl = this.getAttribute('data-url');
                    window.location.href = targetUrl;
                }, 800);
            });
        });

        overBtn.addEventListener('click', function() {
            modalMask.style.display = 'flex';
        });

        sendBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const passwordMeaning = modalInput.value.trim();
            if (passwordMeaning) {
                localStorage.setItem('pwdMean', passwordMeaning);
                alert('发送成功！');
                window.location.href = 'index.html';
            } else {
                alert('请输入密码的含义后再发送！');
            }
        });

        modalMask.addEventListener('click', function(e) {
            if (e.target === modalMask) {
                modalMask.style.display = 'none';
            }
        });
    </script>
</body>
</html>
