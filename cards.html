<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻转卡片 | 新年留言</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f0e6;
            background-image: url("微信图片_20260201011724_549_2.jpg");
            background-blend-mode: overlay;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Ma Shan Zheng', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1500px;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .card-wrap {
            width: 100%;
            height: 350px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
            cursor: pointer;
        }
        .card-wrap.flipped { transform: rotateY(180deg); }

        .card-front,.card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 36px;
            letter-spacing: 2px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            backface-visibility: hidden;
        }

        .card-front {
            background: #FFC2D8;
            color: #A74F68;
        }
        .card-back {
            background: #FFF8E8;
            color: #A70F24;
            transform: rotateY(180deg);
            text-align: center;
            line-height:1.6;
            font-size:28px;
        }

        .over-btn {
            margin-top:60px;
            padding:15px 42px;
            background:linear-gradient(120deg,#FFC2D8,#D8C2F8);
            border:none;
            border-radius:50px;
            font-family: inherit;
            font-size:32px;
            color:#5B5F97;
            cursor:pointer;
            box-shadow:0 8px 15px rgba(0,0,0,0.1);
            transition:all 0.3s;
        }
        .over-btn:hover { transform: translateY(-5px); box-shadow:0 12px 20px rgba(0,0,0,0.15); }

        .modal-mask {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.5);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-box {
            background:#FFF8E8;
            width:90%;max-width:500px;
            border-radius:22px;
            padding:32px;
            text-align:center;
        }
        .modal-title { font-size:30px;color:#a70f24;margin-bottom:22px; }
        #modalInput {
            width:80%;padding:14px 18px;
            border:2px solid #FFC2D8;
            border-radius:12px;
            outline:none;font-size:20px;margin-bottom:22px;
        }
        #sendBtn {
            padding:10px 32px;background:#FFDDAF;border:none;border-radius:50px;font-size:24px;color:#975927;cursor:pointer;
        }

        @media(max-width:768px){
            .card-front,.card-back {font-size:28px;}
            .card-back {font-size:22px;}
        }
    </style>
</head>
<body>
    <div class="cards-container">
        <div class="card-wrap card1" data-link="card1-detail.html">
            <div class="card-front">卡片 1</div>
            <div class="card-back">点击跳转<br>美食回忆录</div>
        </div>
        <div class="card-wrap card2" data-link="card2-detail.html">
            <div class="card-front">卡片 2</div>
            <div class="card-back">点击跳转<br>蕊蕊成长记</div>
        </div>
        <div class="card-wrap card3" data-link="card3-detail.html">
            <div class="card-front">卡片 3</div>
            <div class="card-back">点击跳转<br>奶茶日常</div>
        </div>
        <div class="card-wrap card4" data-link="card4-detail.html">
            <div class="card-front">卡片 4</div>
            <div class="card-back">点击跳转<br>帅哥合集</div>
        </div>
        <div class="card-wrap card5" data-link="card5-detail.html">
            <div class="card-front">卡片 5</div>
            <div class="card-back">点击跳转<br>眼睛成长史</div>
        </div>
        <div class="card-wrap card6" data-link="card6-detail.html">
            <div class="card-front">卡片 6</div>
            <div class="card-back">点击跳转<br>新年快乐</div>
        </div>
    </div>
    <button class="over-btn" id="overBtn">over</button>

    <div class="modal-mask" id="mask">
        <div class="modal-box">
            <div class="modal-title">告诉我你密码的含义吧？</div>
            <input type="text" id="modalInput" placeholder="输入内容...">
            <br>
            <button id="sendBtn">发送</button>
        </div>
    </div>

<script>
const cardWraps = document.querySelectorAll('.card-wrap');
const overBtn = document.getElementById('overBtn');
const mask = document.getElementById('mask');
const sendBtn = document.getElementById('sendBtn');
const modalInput = document.getElementById('modalInput');

//卡片翻转跳转
cardWraps.forEach(item=>{
    item.addEventListener('click',()=>{
        item.classList.add('flipped');
        setTimeout(()=>{
            location.href = item.dataset.link;
        },800)
    })
})

overBtn.onclick = ()=> mask.style.display = 'flex';
mask.onclick = e=>{if(e.target===mask)mask.style.display='none';}

//云端保存，跨设备读取
async function savePwd(text){
    await fetch("https://jsonblob.com/api/jsonBlob/1373012921135198208",{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({content:text,time:new Date().toLocaleString()})
    })
}
//你的查询指令
window.getPwd = async function(){
    let res = await fetch("https://jsonblob.com/api/jsonBlob/1373012921135198208");
    let d = await res.json();
    console.log("🔐密码含义：",d.content,"⏰提交时间：",d.time);
}

sendBtn.addEventListener('click',async function(e){
    e.stopPropagation();
    let val = modalInput.value.trim();
    if(!val){alert("请填写内容");return;}
    await savePwd(val);
    localStorage.setItem("pwdMean",val);
    alert("发送成功！");
    mask.style.display = "none";
    modalInput.value = "";
})
</script>
</body>
</html>
