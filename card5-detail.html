<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十上成长记 | 大一上的美好时光</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: url("微信图片_20260201011724_549_2.jpg") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
            font-family: 'Ma Shan Zheng', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 240, 230, 0.8);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .text-box {
            font-size: 36px;
            color: #a70f24;
            text-align: center;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
            z-index: 1;
        }
        .text-box.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        .image-container {
            width: 300px;
            height: 400px;
            position: relative;
            margin-bottom: 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 1s ease 0.5s;
            z-index: 1;
        }
        .image-container.show {
            opacity: 1;
        }

        .milk-tea-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .milk-tea-img.active {
            opacity: 1;
        }

        .back-btn {
            padding: 15px 40px;
            background: #477B97;
            color: #FFFFFF;
            border: none;
            border-radius: 30px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
            transition: all 0.3s ease;
            z-index: 1;
        }
        .back-btn:hover {
            background: #396780;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .text-box { font-size: 28px; }
            .image-container { width: 250px; height: 350px; }
            .back-btn { font-size: 24px; padding: 12px 30px; }
            body::before { backdrop-filter: blur(5px); }
        }
    </style>
</head>
<body>
    <div class="text-box" id="textBox">瞅瞅这小眼睛😏</div>
    <div class="image-container" id="imageContainer"></div>
    <button class="back-btn" id="backBtn" onclick="window.location.href='cards.html'">返回</button>

    <script>
        const milkTeaImages = [
            "微信图片_20260214215131_1242_2.jpg",
            "微信图片_20260214201322_1216_2.jpg",
            "微信图片_20260214215118_1241_2.jpg",
            "微信图片_20260214215144_1243_2.jpg",
            "微信图片_20260214201325_1219_2.jpg"
        ];

        const textBox = document.getElementById('textBox');
        const imageContainer = document.getElementById('imageContainer');
        const backBtn = document.getElementById('backBtn');
        
        let currentIndex = 0;

        function initImages() {
            milkTeaImages.forEach((imgSrc, index) => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'milk-tea-img';
                img.alt = `成长记${index + 1}`;
                imageContainer.appendChild(img);
            });
        }

        function showNextImage() {
            if (currentIndex >= milkTeaImages.length) {
                textBox.textContent = `我会永远盯着你😏~~~`;
                backBtn.style.display = 'block';
                return;
            }
            const allImages = document.querySelectorAll('.milk-tea-img');
            if (currentIndex > 0) {
                allImages[currentIndex - 1].classList.remove('active');
            }
            allImages[currentIndex].classList.add('active');
            currentIndex++;
            setTimeout(showNextImage, 2000);
        }

        window.onload = function() {
            textBox.classList.add('fade-in');
            setTimeout(() => {
                initImages();
                imageContainer.classList.add('show');
                showNextImage();
            }, 1500);
        };
    </script>
</body>
</html>
