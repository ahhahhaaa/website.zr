<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十上成长记 | 大一上的美好时光</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* 保留虚化背景图 */
            background: url("D:/website/image/微信图片_20260201011724_549_2.jpg") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
            font-family: 'Ma Shan Zheng', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 240, 230, 0.8);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        /* 文本框样式 - 保留浮现动画 */
        .text-box {
            font-size: 36px;
            color: #a70f24;
            text-align: center;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
            z-index: 1;
        }
        .text-box.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* 图片展示容器 - 保留浮现逻辑 */
        .image-container {
            width: 300px;
            height: 400px;
            position: relative;
            margin-bottom: 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 1s ease 0.5s;
            z-index: 1;
        }
        .image-container.show {
            opacity: 1;
        }

        /* 成长图片样式 */
        .milk-tea-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .milk-tea-img.active {
            opacity: 1;
        }

        /* 返回按钮样式 - 100%匹配卡牌5标准色#477B97 */
        .back-btn {
            padding: 15px 40px;
            background: #477B97; /* 卡牌5主色 */
            color: #FFFFFF;      /* 白色文字更适配主色，视觉统一 */
            border: none;
            border-radius: 30px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
            transition: all 0.3s ease;
            z-index: 1;
        }
        .back-btn:hover {
            background: #396780; /* 卡牌5主色加深色，hover更自然 */
            transform: translateY(-3px);
        }

        /* 适配移动端 */
        @media (max-width: 768px) {
            .text-box {
                font-size: 28px;
            }
            .image-container {
                width: 250px;
                height: 350px;
            }
            .back-btn {
                font-size: 24px;
                padding: 12px 30px;
            }
            body::before {
                backdrop-filter: blur(5px);
            }
        }
    </style>
</head>
<body>
    <!-- 文本显示框 - 保留指定文字 -->
    <div class="text-box" id="textBox">瞅瞅这小眼睛😏</div>

    <!-- 图片展示容器 -->
    <div class="image-container" id="imageContainer"></div>

    <!-- 返回按钮 -->
    <button class="back-btn" id="backBtn" onclick="window.location.href='cards.html'">返回</button>

    <script>
        // 保留你指定的最新图片路径列表
        const milkTeaImages = [
            "D:/website/photo/微信图片_20260214215131_1242_2.jpg",
            "D:/website/photo/微信图片_20260214201322_1216_2.jpg",
            "D:/website/photo/微信图片_20260214215118_1241_2.jpg",
            "D:/website/photo/微信图片_20260214215144_1243_2.jpg",
            "D:/website/photo/微信图片_20260214201325_1219_2.jpg"
        ];

        // 获取DOM元素
        const textBox = document.getElementById('textBox');
        const imageContainer = document.getElementById('imageContainer');
        const backBtn = document.getElementById('backBtn');
        
        // 初始化变量
        let currentIndex = 0;

        // 初始化：创建所有图片元素
        function initImages() {
            milkTeaImages.forEach((imgSrc, index) => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'milk-tea-img';
                img.alt = `成长记${index + 1}`;
                imageContainer.appendChild(img);
            });
        }

        // 展示下一张图片 - 保留指定结束文字
        function showNextImage() {
            if (currentIndex >= milkTeaImages.length) {
                textBox.textContent = `我会永远盯着你😏~~~`;
                backBtn.style.display = 'block';
                return;
            }
            const allImages = document.querySelectorAll('.milk-tea-img');
            if (currentIndex > 0) {
                allImages[currentIndex - 1].classList.remove('active');
            }
            allImages[currentIndex].classList.add('active');
            currentIndex++;
            setTimeout(showNextImage, 2000);
        }

        // 页面加载逻辑不变
        window.onload = function() {
            textBox.classList.add('fade-in');
            setTimeout(() => {
                initImages();
                imageContainer.classList.add('show');
                showNextImage();
            }, 1500);
        };
    </script>
</body>
</html>
