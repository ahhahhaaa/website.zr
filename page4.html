<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新的一年 | 但入新年，愿百“柿”，皆如意</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f0e6;
            background-image: url("微信图片_20260201011724_549_2.jpg");
            background-blend-mode: overlay;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Ma Shan Zheng', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .top-img {
            width: 180px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite alternate;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            padding: 40px 60px;
            border-radius: 24px;
            box-shadow: 
                0 15px 30px rgba(0,0,0,0.08),
                inset 0 0 20px rgba(255, 255, 255, 0.25);
            text-align: center;
            max-width: 600px;
            width: 100%;
            border: 10px solid rgba(240, 230, 210, 0.75);
            margin-bottom: 30px;
        }

        .main-text {
            font-size: 36px;
            color: #a70f24;
            line-height: 1.8;
            letter-spacing: 2px;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.08);
        }

        .back-btn {
            padding: 15px 40px;
            font-size: 24px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-family: 'Ma Shan Zheng', cursive;
            background: linear-gradient(90deg, #c8102e 0%, #d1213b 100%);
            border: 4px solid #e8c850;
            box-shadow: 
                0 8px 0 #a70f24,
                0 10px 15px rgba(0,0,0,0.08);
        }
        .back-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #b70e29 0%, #c8102e 100%);
            box-shadow: 
                0 8px 0 #960d20,
                0 10px 15px rgba(0,0,0,0.1);
        }
        .back-btn:active {
            transform: translateY(8px);
            box-shadow: 
                0 0 0 #960d20,
                0 5px 10px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <img src="4.png" class="top-img" alt="配图4">
    <div class="container">
        <p class="main-text">
            但入新年，愿百“柿”，皆如意
        </p>
    </div>
    <button class="back-btn" onclick="window.location.href='index.html'">Back</button>
</body>
</html>
